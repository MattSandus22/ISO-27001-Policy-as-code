# Statement of Applicability inputs (ISO/IEC 27001:2022, 6.1.3 d).
#
# Every Annex A control is applicable unless listed here with applicable: false
# and a justification. Which policies address each control is read from the
# policies' front matter, so it never needs to be maintained by hand.
#
# Use addressed_by for applicable controls met by documents other than policies
# (procedures, standards, contracts).

controls:
  A.7.11:
    applicable: false
    justification: >
      No in-scope information processing facilities are operated by Northwind.
      Production runs in AWS; supporting utilities are the cloud provider's
      responsibility and are assured through supplier reviews (A.5.23).
  A.7.12:
    applicable: false
    justification: >
      As for A.7.11. Office network cabling carries no in-scope traffic other than
      encrypted connections to cloud services.
  A.7.13:
    applicable: false
    justification: >
      As for A.7.11. Corporate endpoints are leased and maintained by the leasing
      provider under contract; endpoint security is covered by A.8.1.

  A.5.37:
    addressed_by: Runbooks in the Engineering wiki (ENG-RUN series)
